name: Preview PVP notice experiment coverage (read-only)

on:
  push:
    paths:
      - '.github/workflows/pvp-notice-experiment-coverage-preview.yml'
      - 'src/audit/pvp_notice_experiment_coverage_v1.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing parser dependencies
        run: python -m pip install 'requests>=2.32,<3' 'pypdf>=5.9,<7'
      - name: Test first-page parser
        run: python -m unittest -v tests/test_pvp_notice_text_v1.py
      - name: Compare stored experiment values with first-page PDF text
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: python src/audit/pvp_notice_experiment_coverage_v1.py
      - name: Save aggregate results and bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pvp-notice-experiment-coverage
          path: runtime/reports/pvp_notice_experiment_coverage_v1.json
          if-no-files-found: warn
          retention-days: 7
