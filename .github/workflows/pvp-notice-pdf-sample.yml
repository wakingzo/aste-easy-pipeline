name: PVP first-page PDF notice read-only sample

on:
  pull_request:
    paths:
      - 'src/importer/pvp_notice_text_v1.py'
      - 'src/importer/pvp_notice_enrichment_v1.py'
      - 'src/importer/pvp_document_text_daily_v1.py'
      - 'tests/test_pvp_document_text_daily_v1.py'
      - 'src/pipeline/daily_pipeline_v4.py'
      - 'requirements-container.txt'
      - '.github/workflows/daily.yml'
      - 'tests/test_pvp_notice_enrichment_v1.py'
      - 'src/audit/pvp_notice_pdf_probe_v1.py'
      - 'tests/test_pvp_notice_text_v1.py'
      - '.github/workflows/pvp-notice-pdf-sample.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF text parser only for this audit (not daily pipeline)
        run: python -m pip install 'requests>=2.32,<3' 'pypdf>=5.9,<7'
      - name: Compile and run offline regression tests
        run: |
          python -m py_compile src/importer/pvp_notice_text_v1.py src/importer/pvp_notice_enrichment_v1.py src/importer/pvp_document_text_daily_v1.py src/audit/pvp_notice_pdf_probe_v1.py src/pipeline/daily_pipeline_v4.py
          python -m unittest -v tests/test_pvp_document_text_daily_v1.py tests/test_pvp_document_text_smoketest_v1.py tests/test_pvp_notice_text_v1.py tests/test_pvp_notice_enrichment_v1.py tests/test_pvp_sale_fields_v1.py
      - name: Download and analyze at most 50 recent PVP notices, read only
        if: github.event_name == 'workflow_dispatch'
        run: python src/audit/pvp_notice_pdf_probe_v1.py --missing 40 --controls 10 --lookback 600
      - name: Upload report (never actual PDFs or full document text)
        if: github.event_name == 'workflow_dispatch' && always()
        uses: actions/upload-artifact@v4
        with:
          name: pvp-notice-pdf-sample
          path: runtime/reports/pvp_notice_pdf_probe_*.json
          retention-days: 7
          if-no-files-found: warn
