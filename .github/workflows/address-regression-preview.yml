name: Regression preview - address guards

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Python dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Run address regression checks
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import sys
          from pathlib import Path

          root = Path.cwd()
          sys.path.insert(0, str((root / "src").resolve()))
          sys.path.insert(0, str((root / "src" / "importer").resolve()))
          sys.path.insert(0, str((root / "src" / "geocoding").resolve()))

          import build_listings_daily_v3_16 as builder
          import google_geocode_core_v9_3_6 as g

          def check(label, condition, detail=""):
              if not condition:
                  raise AssertionError(f"{label} FAILED: {detail}")
              print(f"[PASS] {label}" + (f": {detail}" if detail else ""))

          nettuno = builder.build_listing_row(
              {
                  "id": "TEST-NETTUNO",
                  "indirizzo": {
                      "via": "Via del Tridente, 39, 00048 Nettuno RM",
                      "numeroCivico": "39",
                      "cap": "00048",
                      "citta": "Velletri",
                      "provincia": "Roma",
                      "coordinate": {},
                  },
              },
              {},
          )
          check("Nettuno comune", nettuno.get("comune") == "Nettuno", repr(nettuno.get("comune")))
          check("Nettuno CAP", nettuno.get("cap") == "00048", repr(nettuno.get("cap")))
          check("Nettuno sigla", nettuno.get("sigla_provincia") == "RM", repr(nettuno.get("sigla_provincia")))
          check(
              "Nettuno indirizzo + no doppio civico",
              nettuno.get("indirizzo") == "Via del Tridente, 39, 00048 Nettuno (RM)",
              repr(nettuno.get("indirizzo")),
          )

          montecassiano = builder.build_listing_row(
              {
                  "id": "TEST-MONTECASSIANO",
                  "indirizzo": {
                      "via": "Via Sant'Anna, 2, 62010 Montecassiano MC",
                      "numeroCivico": "2",
                      "cap": "62010",
                      "citta": "Macerata",
                      "provincia": "Macerata",
                      "coordinate": {},
                  },
              },
              {},
          )
          check("Montecassiano comune", montecassiano.get("comune") == "Montecassiano", repr(montecassiano.get("comune")))
          check("Montecassiano CAP", montecassiano.get("cap") == "62010", repr(montecassiano.get("cap")))
          check("Montecassiano sigla", montecassiano.get("sigla_provincia") == "MC", repr(montecassiano.get("sigla_provincia")))
          check(
              "Montecassiano indirizzo + no doppio civico",
              montecassiano.get("indirizzo") == "Via Sant'Anna, 2, 62010 Montecassiano (MC)",
              repr(montecassiano.get("indirizzo")),
          )

          normal = builder.build_listing_row(
              {
                  "id": "TEST-NORMAL",
                  "indirizzo": {
                      "via": "Via Roma",
                      "numeroCivico": "12",
                      "cap": "07026",
                      "citta": "Olbia",
                      "provincia": "Sassari",
                      "coordinate": {},
                  },
              },
              {},
          )
          check("Indirizzo normale invariato", normal.get("comune") == "Olbia", repr(normal))
          check(
              "Civico normale aggiunto",
              normal.get("indirizzo") == "Via Roma 12, 07026 Olbia (SS)",
              repr(normal.get("indirizzo")),
          )

          bruscoli = g.phrase_similarity("Via Bruscoli", "Via Bruscoli Tabina")
          cavour = g.phrase_similarity("Via Cavour", "Via Camillo Benso Conte di Cavour")
          garibaldi = g.phrase_similarity("Via Giuseppe Garibaldi", "Via Garibaldi")

          check("Bruscoli/Tabina below acceptance threshold", bruscoli is not None and bruscoli < 0.55, repr(bruscoli))
          check("Cavour expansion remains accepted", cavour is not None and cavour >= 0.55, repr(cavour))
          check("Garibaldi abbreviation remains accepted", garibaldi is not None and garibaldi >= 0.55, repr(garibaldi))

          row = {
              "indirizzo": "Frazione Bruscoli, via Bruscoli 48, 50033 Firenzuola Firenze",
              "comune": "Firenzuola",
              "sigla_provincia": "FI",
              "cap": "50033",
          }
          result = {
              "ok": True,
              "lat": 44.1376642,
              "lon": 11.2554945,
              "formatted_address": "Via Bruscoli Tabina, 48, 50033 Firenzuola FI, Italia",
              "location_type": "RANGE_INTERPOLATED",
              "components": [
                  {"long_name": "48", "short_name": "48", "types": ["street_number"]},
                  {"long_name": "Via Bruscoli Tabina", "short_name": "Via Bruscoli Tabina", "types": ["route"]},
                  {"long_name": "Firenzuola", "short_name": "Firenzuola", "types": ["locality"]},
                  {"long_name": "Firenze", "short_name": "FI", "types": ["administrative_area_level_2"]},
                  {"long_name": "50033", "short_name": "50033", "types": ["postal_code"]},
              ],
          }
          evaluation = g.score_forward_candidate(row, result)
          check("Full scorer rejects Bruscoli Tabina", evaluation is None, repr(evaluation))

          print()
          print("ALL REGRESSION CHECKS PASSED")
          PY
