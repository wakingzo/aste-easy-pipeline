name: Historical comune repair preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build corrected read-only repair preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/reports

          python - <<'PY'
          import csv
          import hashlib
          import json
          import os
          import re
          import sys
          from collections import Counter, defaultdict
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          ROOT = Path.cwd()
          sys.path.insert(0, str((ROOT / "src").resolve()))
          sys.path.insert(0, str((ROOT / "src" / "importer").resolve()))

          import build_listings_daily_v3_16 as builder

          REF = ROOT / "data" / "reference" / "comuni_cap.csv"
          OUTDIR = ROOT / "runtime" / "reports"
          OUTDIR.mkdir(parents=True, exist_ok=True)

          def clean(v):
              if v is None:
                  return ""
              return re.sub(
                  r"\s+",
                  " ",
                  str(v).replace("\u00a0", " "),
              ).strip()

          def norm_cap(v):
              digits = re.sub(r"\D", "", clean(v))
              if not digits:
                  return ""
              return digits.zfill(5) if len(digits) <= 5 else digits

          def norm_sigla(v):
              return re.sub(r"[^A-Za-z]", "", clean(v)).upper()

          def fingerprint(row):
              keys = (
                  "pvp_id",
                  "indirizzo",
                  "comune",
                  "sigla_provincia",
                  "cap",
                  "pvp_latitudine",
                  "pvp_longitudine",
                  "pvp_geo_source",
              )
              data = json.dumps(
                  {k: row.get(k) for k in keys},
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              )
              return hashlib.sha256(data.encode("utf-8")).hexdigest()

          # ------------------------------------------------------------------
          # Load canonical CAP + Comune + sigla combinations.
          # Unlike extract_verified_admin_tail(), this audit deliberately
          # searches a verified triple ANYWHERE inside old hybrid DB addresses.
          # ------------------------------------------------------------------
          triples_by_cap = defaultdict(list)

          with REF.open(
              "r",
              encoding="utf-8-sig",
              errors="replace",
              newline="",
          ) as f:
              for row in csv.DictReader(f, delimiter=";"):
                  comune = clean(row.get("comune"))
                  cap = norm_cap(row.get("cap"))
                  sigla = norm_sigla(row.get("sigla_provincia"))

                  if not comune or not cap or len(sigla) != 2:
                      continue

                  triples_by_cap[cap].append({
                      "cap": cap,
                      "comune": comune,
                      "comune_norm": builder.normalize_admin_match_text(comune),
                      "sigla_provincia": sigla,
                  })

          def embedded_verified_candidates(address):
              raw = clean(address)
              normalized = builder.normalize_admin_match_text(raw)

              caps = set(
                  re.findall(
                      r"(?<!\d)\d{5}(?!\d)",
                      normalized,
                  )
              )

              found = {}

              for cap in caps:
                  for rec in triples_by_cap.get(cap, ()):
                      needle = (
                          f"{cap} "
                          f"{rec['comune_norm']} "
                          f"{rec['sigla_provincia'].lower()}"
                      )

                      if not re.search(
                          r"(?<![a-z0-9])"
                          + re.escape(needle)
                          + r"(?![a-z0-9])",
                          normalized,
                      ):
                          continue

                      key = (
                          rec["cap"],
                          rec["comune_norm"],
                          rec["sigla_provincia"],
                      )

                      # Historical hybrid rows were built as:
                      # <street/civic>, <embedded CAP Comune SIGLA>, <DB tail>.
                      # The first occurrence of the verified CAP therefore marks
                      # the start of the embedded administrative fragment.
                      cap_match = re.search(
                          r"(?<!\d)"
                          + re.escape(rec["cap"])
                          + r"(?!\d)",
                          raw,
                      )
                      street = (
                          raw[:cap_match.start()].rstrip(" ,")
                          if cap_match
                          else ""
                      )

                      found[key] = {
                          **rec,
                          "via": street,
                      }

              return list(found.values())

          # ------------------------------------------------------------------
          # Read current listings from Supabase. GET only.
          # ------------------------------------------------------------------
          fields = [
              "pvp_id",
              "status",
              "indirizzo",
              "comune",
              "cap",
              "sigla_provincia",
              "provincia",
              "regione",
              "descrizione",
              "maps_link",
              "latitudine",
              "longitudine",
              "pvp_latitudine",
              "pvp_longitudine",
              "pvp_geo_source",
              "geocode_status",
              "geocode_source",
              "geocode_precision",
              "geocode_input_hash",
          ]

          base = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SERVICE_ROLE"]

          rows = []
          limit = 1000
          offset = 0

          while True:
              params = urlencode({
                  "select": ",".join(fields),
                  "order": "pvp_id.asc",
                  "limit": str(limit),
                  "offset": str(offset),
              })

              req = Request(
                  base + "/rest/v1/listings?" + params,
                  method="GET",
              )
              req.add_header("apikey", key)
              req.add_header(
                  "Authorization",
                  "Bearer " + key,
              )

              with urlopen(req, timeout=60) as resp:
                  batch = json.loads(
                      resp.read().decode("utf-8")
                  )

              if not isinstance(batch, list):
                  raise RuntimeError(
                      "Unexpected Supabase response"
                  )

              rows.extend(batch)

              print(
                  f"[FETCH] offset={offset:,} "
                  f"rows={len(batch):,} "
                  f"total={len(rows):,}"
              )

              if len(batch) < limit:
                  break

              offset += limit

          preview = []
          counts = Counter()
          multiple_candidate_rows = []

          for row in rows:
              candidates = embedded_verified_candidates(
                  row.get("indirizzo")
              )

              if not candidates:
                  continue

              if len(candidates) != 1:
                  multiple_candidate_rows.append({
                      "pvp_id": row.get("pvp_id"),
                      "indirizzo": row.get("indirizzo"),
                      "candidate_count": len(candidates),
                      "candidates": " | ".join(
                          f"{x['cap']} {x['comune']} "
                          f"{x['sigla_provincia']}"
                          for x in candidates
                      ),
                  })
                  continue

              candidate = candidates[0]
              current_comune = clean(row.get("comune"))
              embedded_comune = clean(candidate.get("comune"))

              if not current_comune:
                  continue

              if (
                  builder.normalize_admin_match_text(
                      current_comune
                  )
                  == builder.normalize_admin_match_text(
                      embedded_comune
                  )
              ):
                  continue

              description = clean(row.get("descrizione"))

              current_mentioned = (
                  builder.description_mentions_comune(
                      description,
                      current_comune,
                  )
              )
              embedded_mentioned = (
                  builder.description_mentions_comune(
                      description,
                      embedded_comune,
                  )
              )

              resolver_accepts = (
                  builder.description_confirms_embedded_admin(
                      {"descLotto": description},
                      {},
                      current_comune,
                      clean(row.get("provincia")),
                      candidate,
                  )
              )

              if resolver_accepts:
                  action = "AUTO_FIX"
                  reason = (
                      "description mentions embedded comune only; "
                      "same-province guard passed"
                  )
              elif (
                  current_mentioned
                  and not embedded_mentioned
              ):
                  action = "KEEP_DB"
                  reason = (
                      "description confirms current DB comune"
                  )
              elif (
                  current_mentioned
                  and embedded_mentioned
              ):
                  action = "REVIEW"
                  reason = (
                      "description mentions both current and "
                      "embedded comune"
                  )
              elif (
                  embedded_mentioned
                  and not current_mentioned
              ):
                  action = "REVIEW"
                  reason = (
                      "description favors embedded comune, but "
                      "production safety guard blocks auto-fix"
                  )
              else:
                  action = "REVIEW"
                  reason = (
                      "description provides no decisive "
                      "municipality evidence"
                  )

              counts[action] += 1

              proposed_comune = ""
              proposed_cap = ""
              proposed_sigla = ""
              proposed_indirizzo = ""
              proposed_geocode_status = ""
              proposed_geocode_input_hash = ""
              proposed_reset_geocoding = ""

              if action == "AUTO_FIX":
                  proposed_comune = candidate["comune"]
                  proposed_cap = candidate["cap"]
                  proposed_sigla = (
                      candidate["sigla_provincia"]
                  )
                  proposed_indirizzo = (
                      builder.build_full_property_address(
                          candidate["via"],
                          proposed_cap,
                          proposed_comune,
                          proposed_sigla,
                      )
                  )

                  future_row = dict(row)
                  future_row.update({
                      "comune": proposed_comune,
                      "cap": proposed_cap,
                      "sigla_provincia": proposed_sigla,
                      "indirizzo": proposed_indirizzo,
                  })

                  proposed_geocode_status = "PENDING"
                  proposed_geocode_input_hash = fingerprint(
                      future_row
                  )
                  proposed_reset_geocoding = (
                      "YES: clear latitudine, longitudine, "
                      "maps_link and derived geocode metadata"
                  )

              preview.append({
                  "pvp_id": row.get("pvp_id"),
                  "action": action,
                  "reason": reason,
                  "status": row.get("status"),
                  "current_comune": row.get("comune"),
                  "current_cap": row.get("cap"),
                  "current_sigla": row.get(
                      "sigla_provincia"
                  ),
                  "provincia": row.get("provincia"),
                  "current_indirizzo": row.get(
                      "indirizzo"
                  ),
                  "embedded_via": candidate.get("via"),
                  "embedded_comune": candidate.get(
                      "comune"
                  ),
                  "embedded_cap": candidate.get("cap"),
                  "embedded_sigla": candidate.get(
                      "sigla_provincia"
                  ),
                  "description_mentions_current": (
                      current_mentioned
                  ),
                  "description_mentions_embedded": (
                      embedded_mentioned
                  ),
                  "descrizione": description,
                  "current_geocode_status": row.get(
                      "geocode_status"
                  ),
                  "current_geocode_source": row.get(
                      "geocode_source"
                  ),
                  "current_geocode_precision": row.get(
                      "geocode_precision"
                  ),
                  "current_latitudine": row.get(
                      "latitudine"
                  ),
                  "current_longitudine": row.get(
                      "longitudine"
                  ),
                  "current_maps_link": row.get(
                      "maps_link"
                  ),
                  "current_geocode_input_hash": row.get(
                      "geocode_input_hash"
                  ),
                  "proposed_comune": proposed_comune,
                  "proposed_cap": proposed_cap,
                  "proposed_sigla": proposed_sigla,
                  "proposed_indirizzo": proposed_indirizzo,
                  "proposed_geocode_status": (
                      proposed_geocode_status
                  ),
                  "proposed_geocode_input_hash": (
                      proposed_geocode_input_hash
                  ),
                  "proposed_reset_geocoding": (
                      proposed_reset_geocoding
                  ),
              })

          if not preview:
              raise RuntimeError(
                  "No municipality conflicts detected. "
                  "This preview is expected to find the historical "
                  "hybrid-address conflicts; detection likely regressed."
              )

          stamp = datetime.now(
              timezone.utc
          ).strftime("%Y%m%d-%H%M%S")

          csv_path = (
              OUTDIR
              / f"historical_comune_repair_preview_{stamp}.csv"
          )
          json_path = (
              OUTDIR
              / f"historical_comune_repair_preview_{stamp}.json"
          )
          multi_path = (
              OUTDIR
              / f"historical_comune_repair_multiple_{stamp}.csv"
          )

          cols = []
          for rec in preview:
              for k in rec:
                  if k not in cols:
                      cols.append(k)

          with csv_path.open(
              "w",
              encoding="utf-8-sig",
              newline="",
          ) as f:
              writer = csv.DictWriter(
                  f,
                  fieldnames=cols,
              )
              writer.writeheader()
              writer.writerows(preview)

          multi_cols = [
              "pvp_id",
              "indirizzo",
              "candidate_count",
              "candidates",
          ]

          with multi_path.open(
              "w",
              encoding="utf-8-sig",
              newline="",
          ) as f:
              writer = csv.DictWriter(
                  f,
                  fieldnames=multi_cols,
              )
              writer.writeheader()
              writer.writerows(
                  multiple_candidate_rows
              )

          summary = {
              "mode": "READ_ONLY_NO_WRITES",
              "created_at_utc": datetime.now(
                  timezone.utc
              ).isoformat(),
              "total_listings_scanned": len(rows),
              "true_comune_conflicts": len(preview),
              "multiple_candidate_rows": len(
                  multiple_candidate_rows
              ),
              "action_counts": dict(counts),
              "auto_fix_ids": [
                  str(x["pvp_id"])
                  for x in preview
                  if x["action"] == "AUTO_FIX"
              ],
              "keep_db_ids": [
                  str(x["pvp_id"])
                  for x in preview
                  if x["action"] == "KEEP_DB"
              ],
              "review_ids": [
                  str(x["pvp_id"])
                  for x in preview
                  if x["action"] == "REVIEW"
              ],
              "safety": {
                  "supabase_writes": 0,
                  "google_calls": 0,
                  "auto_fix_requires": (
                      "embedded municipality explicitly mentioned "
                      "in description, current municipality not "
                      "mentioned, same-province guard passed"
                  ),
                  "future_patch_note": (
                      "Any AUTO_FIX must reset published geocoding "
                      "coordinates/maps and set geocode_status=PENDING "
                      "with a recomputed input hash."
                  ),
              },
          }

          json_path.write_text(
              json.dumps(
                  summary,
                  ensure_ascii=False,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )

          print()
          print("[SUMMARY]")
          print(
              json.dumps(
                  summary,
                  ensure_ascii=False,
                  indent=2,
              )
          )

          print()
          print("[AUTO_FIX]")
          for rec in preview:
              if rec["action"] == "AUTO_FIX":
                  print(
                      f"{rec['pvp_id']}: "
                      f"{rec['current_comune']} -> "
                      f"{rec['proposed_comune']} | "
                      f"{rec['proposed_indirizzo']}"
                  )

          print()
          print("[KEEP_DB]")
          for rec in preview:
              if rec["action"] == "KEEP_DB":
                  print(
                      f"{rec['pvp_id']}: "
                      f"keep {rec['current_comune']} | "
                      f"embedded={rec['embedded_comune']}"
                  )

          print()
          print(f"[CSV] {csv_path}")
          print(f"[JSON] {json_path}")

          step_summary = os.environ.get(
              "GITHUB_STEP_SUMMARY"
          )
          if step_summary:
              with open(
                  step_summary,
                  "a",
                  encoding="utf-8",
              ) as f:
                  f.write(
                      "## Historical comune repair preview\n\n"
                  )
                  f.write(
                      f"- Conflicts: **{len(preview)}**\n"
                  )
                  f.write(
                      f"- AUTO_FIX: **{counts['AUTO_FIX']}**\n"
                  )
                  f.write(
                      f"- KEEP_DB: **{counts['KEEP_DB']}**\n"
                  )
                  f.write(
                      f"- REVIEW: **{counts['REVIEW']}**\n"
                  )
                  f.write(
                      "\nRead-only: **0 Supabase writes, "
                      "0 Google calls**.\n"
                  )
          PY

      - name: Upload preview reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: historical-comune-repair-preview-${{ github.run_id }}
          path: runtime/reports/historical_comune_repair_*
          if-no-files-found: error
          retention-days: 14
