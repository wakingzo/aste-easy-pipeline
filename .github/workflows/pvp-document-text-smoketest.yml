name: One-time PVP document text to Supabase smoke test

on:
  pull_request:
    paths:
      - "src/audit/pvp_document_text_smoketest_v1.py"
      - "tests/test_pvp_document_text_smoketest_v1.py"
      - ".github/workflows/pvp-document-text-smoketest.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/pvp-document-text-smoketest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pvp-document-text-smoketest
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: python -m pip install 'requests>=2.32,<3' 'pypdf>=5.9,<7'
      - name: Offline checks and syntax validation
        run: |
          python -m py_compile src/audit/pvp_document_text_smoketest_v1.py
          python -m unittest -v tests/test_pvp_document_text_smoketest_v1.py tests/test_pvp_notice_text_v1.py

  save-three:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
      ALLOW_PVP_TEXT_SMOKETEST_WRITE: YES_ONLY_3_IDS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install text-only dependencies
        run: python -m pip install 'requests>=2.32,<3' 'pypdf>=5.9,<7'
      - name: Download exactly three preselected PVP notices and verify text in private Supabase table
        run: python src/audit/pvp_document_text_smoketest_v1.py --apply
      - name: Upload metadata report only (no PDF or extracted full text)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pvp-document-text-smoketest-metadata
          path: runtime/reports/pvp_document_text_smoketest.json
          if-no-files-found: warn
          retention-days: 7
